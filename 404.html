<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Không tìm thấy trang | Lễ Tốt Nghiệp - Phan Thanh Bình</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0f1e" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0f1e'/%3E%3Cpath d='M50 12 L82 24 V52 C82 72 50 88 50 88 C50 88 18 72 18 52 V24 Z' fill='none' stroke='%23c9a84c' stroke-width='4'/%3E%3Ctext x='50' y='58' font-family='Georgia, serif' font-size='26' font-weight='bold' fill='%23e8c97a' text-anchor='middle'%3EPTB%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      position: relative;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent);
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.35);
      margin-bottom: var(--space-xs);
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      color: var(--color-text);
      margin-bottom: var(--space-sm);
    }
    .error-desc {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      max-width: 480px;
      margin: 0 auto var(--space-lg);
      line-height: 1.6;
    }
    .error-card {
      max-width: 540px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="card error-card">
      <div class="hero-monogram-placeholder" style="width: 70px; height: 70px; font-size: 1.6rem; margin: 0 auto var(--space-md); border: 2px solid var(--color-accent);" aria-label="PTB Monogram">PTB</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Không Tìm Thấy Trang</h1>
      <p class="error-desc">
        Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển hướng. Hãy quay về trang chính của thiệp mời nhé!
        <br />
        <em style="font-size: var(--text-sm); opacity: 0.8;">The page you are looking for does not exist. Please return to the main invitation page.</em>
      </p>
      <a href="/" class="btn btn-primary">
        <span>🏠</span>
        <span>Về Trang Thiệp Mời / Back Home</span>
      </a>
    </div>
  </div>
</body>
</html>
