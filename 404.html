<!DOCTYPE html>

<head>

  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F8F6F1" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23F8F6F1' stroke='%23E6E1D6' stroke-width='2'/%3E%3Cpath d='M50 14 L80 26 V52 C80 70 50 86 50 86 C50 86 20 70 20 52 V26 Z' fill='%23FFFEFA' stroke='%23A48A57' stroke-width='3.5'/%3E%3Ctext x='50' y='57' font-family='Georgia, serif' font-size='24' font-weight='bold' fill='%23252820' text-anchor='middle'%3EPTB%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />

  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      position: relative;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 500;
      line-height: 1;
      color: var(--color-accent);
      margin-bottom: var(--space-xs);
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      color: var(--color-text);
      margin-bottom: var(--space-sm);
    }
    .error-desc {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      max-width: 480px;
      margin: 0 auto var(--space-lg);
      line-height: 1.6;
    }
    .error-card {
      max-width: 540px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="card error-card">
      <div class="hero-monogram-placeholder" style="width: 70px; height: 70px; font-size: 1.6rem; margin: 0 auto var(--space-md); border: 2px solid var(--color-accent);" aria-label="PTB Monogram">PTB</div>
      <div class="error-code">404</div>
      <h1 class="error-title">Không Tìm Thấy Trang</h1>
      <p class="error-desc">
        Trang bạn đang tìm kiếm không tồn tại hoặc đã được chuyển hướng. Hãy quay về trang chính của thiệp mời nhé!
        <br />
        <em style="font-size: var(--text-sm); opacity: 0.8;">The page you are looking for does not exist. Please return to the main invitation page.</em>
      </p>
      <a href="/" class="btn btn-primary">
        <span>🏠</span>
        <span>Về Trang Thiệp Mời / Back Home</span>
      </a>
    </div>
  </div>
</body>
</html>
